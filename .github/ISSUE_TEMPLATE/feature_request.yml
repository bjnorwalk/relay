name: Feature request
description: Propose a focused product or engineering improvement.
title: 'feat: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or engineering need.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the intended behavior and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and tradeoffs
      description: Identify milestone fit, alternatives, and exclusions.
